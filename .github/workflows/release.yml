name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g., 1.0.3)'
        required: true
      build_number:
        description: 'Build number (e.g., 161)'
        required: true
      release_notes:
        description: 'Release notes (HTML list items for appcast)'
        required: true
        type: string

env:
  SCHEME: Echo
  PRODUCT_NAME: Echo
  XCODE_PROJECT: VoiceInk.xcodeproj

jobs:
  build-and-release:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Set version numbers
        run: |
          cd $XCODE_PROJECT/..
          agvtool new-marketing-version ${{ inputs.version }}
          agvtool new-version -all ${{ inputs.build_number }}

      # Xcode project references whisper.xcframework via ../ relative paths,
      # so symlinks must be created at the parent of the repo checkout
      - name: Setup whisper.xcframework paths
        run: |
          mkdir -p ../whisper.cpp/build-apple
          ln -sf "$GITHUB_WORKSPACE/whisper.xcframework" ../whisper.cpp/build-apple/whisper.xcframework
          mkdir -p ../build-apple
          ln -sf "$GITHUB_WORKSPACE/whisper.xcframework" ../build-apple/whisper.xcframework

      - name: Import code signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 20)

          # Decode certificate
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project $XCODE_PROJECT \
            -scheme $SCHEME \
            -clonedSourcePackagesDirPath $RUNNER_TEMP/spm

      - name: Build archive
        run: |
          xcodebuild archive \
            -project $XCODE_PROJECT \
            -scheme $SCHEME \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Echo.xcarchive \
            -clonedSourcePackagesDirPath $RUNNER_TEMP/spm \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Export archive
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Echo.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Create DMG
        run: |
          APP_PATH="$RUNNER_TEMP/export/Echo.app"
          DMG_PATH="$RUNNER_TEMP/Echo.dmg"

          # Create a temporary directory for the DMG contents
          DMG_DIR=$RUNNER_TEMP/dmg-contents
          mkdir -p "$DMG_DIR"
          cp -R "$APP_PATH" "$DMG_DIR/"
          ln -s /Applications "$DMG_DIR/Applications"

          hdiutil create -volname "Echo" \
            -srcfolder "$DMG_DIR" \
            -ov -format UDZO \
            "$DMG_PATH"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$RUNNER_TEMP/Echo.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 600

          # Staple the notarization ticket
          xcrun stapler staple "$RUNNER_TEMP/Echo.dmg"

      - name: Sign with Sparkle EdDSA key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Find Sparkle's sign_update tool from SPM checkout
          SIGN_UPDATE=$(find $RUNNER_TEMP/spm -name "sign_update" -type f | head -1)

          if [ -z "$SIGN_UPDATE" ]; then
            echo "ERROR: Could not find Sparkle sign_update tool"
            exit 1
          fi
          chmod +x "$SIGN_UPDATE"

          # Sign the DMG and capture the output
          SIGNATURE=$("$SIGN_UPDATE" "$RUNNER_TEMP/Echo.dmg" --ed-key-file <(echo "$SPARKLE_PRIVATE_KEY") 2>&1)
          echo "Sparkle signature output: $SIGNATURE"

          # Parse sparkle:edSignature and length from the output
          ED_SIGNATURE=$(echo "$SIGNATURE" | grep -o 'sparkle:edSignature="[^"]*"' | sed 's/sparkle:edSignature="//;s/"//')
          LENGTH=$(echo "$SIGNATURE" | grep -o 'length="[^"]*"' | sed 's/length="//;s/"//')

          echo "ED_SIGNATURE=$ED_SIGNATURE" >> $GITHUB_ENV
          echo "LENGTH=$LENGTH" >> $GITHUB_ENV

      - name: Update appcast.xml
        run: |
          PUB_DATE=$(date -u "+%a, %d %b %Y %H:%M:%S %z")
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}/Echo.dmg"

          cat > website/public/appcast.xml << EOF
          <?xml version="1.0" standalone="yes"?>
          <rss xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" version="2.0">
              <channel>
                  <title>Echo Releases</title>
                  <item>
                      <title>${{ inputs.version }}</title>
                      <pubDate>${PUB_DATE}</pubDate>
                      <sparkle:version>${{ inputs.build_number }}</sparkle:version>
                      <sparkle:shortVersionString>${{ inputs.version }}</sparkle:shortVersionString>
                      <sparkle:minimumSystemVersion>15.0</sparkle:minimumSystemVersion>
                      <description><![CDATA[
                          <h3>What's New in Version ${{ inputs.version }}</h3>
                          <ul>
                              ${{ inputs.release_notes }}
                          </ul>
                      ]]></description>
                      <enclosure url="${DOWNLOAD_URL}" length="${LENGTH}" type="application/octet-stream" sparkle:edSignature="${ED_SIGNATURE}"/>
                  </item>
              </channel>
          </rss>
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" \
            "$RUNNER_TEMP/Echo.dmg" \
            --title "Echo v${{ inputs.version }}" \
            --notes "## What's New in v${{ inputs.version }}

          ${{ inputs.release_notes }}"

      - name: Commit updated appcast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/public/appcast.xml
          git commit -m "Update appcast.xml for v${{ inputs.version }}"
          git push

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
