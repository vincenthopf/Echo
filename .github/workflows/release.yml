name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g., 1.0.3)'
        required: true
      build_number:
        description: 'Build number (e.g., 161)'
        required: true
      release_notes:
        description: 'Release notes (markdown bullet points, e.g. "- Fixed X\n- Added Y")'
        required: true
        type: string

env:
  SCHEME: Echo
  PRODUCT_NAME: Echo
  XCODE_PROJECT: VoiceInk.xcodeproj

jobs:
  build-and-release:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Set version numbers
        run: |
          agvtool new-marketing-version ${{ inputs.version }}
          agvtool new-version -all ${{ inputs.build_number }}

      # Xcode project references whisper.xcframework via ../ relative paths from the repo root.
      # Copy framework and create empty dSYMs dirs (not tracked in git but referenced in Info.plist).
      - name: Setup whisper.xcframework paths
        run: |
          for target_dir in ../whisper.cpp/build-apple ../build-apple; do
            mkdir -p "$target_dir"
            cp -R whisper.xcframework "$target_dir/"
            for slice in "$target_dir"/whisper.xcframework/*/; do
              mkdir -p "$slice/dSYMs"
            done
          done

      - name: Import code signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 20)

          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Store keychain password for cleanup
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project $XCODE_PROJECT \
            -scheme $SCHEME \
            -clonedSourcePackagesDirPath $RUNNER_TEMP/spm

      - name: Build app
        run: |
          xcodebuild build \
            -project $XCODE_PROJECT \
            -scheme $SCHEME \
            -configuration Release \
            -derivedDataPath $RUNNER_TEMP/build \
            -clonedSourcePackagesDirPath $RUNNER_TEMP/spm \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""

      - name: Sign app with Developer ID
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="$RUNNER_TEMP/build/Build/Products/Release/Echo.app"
          IDENTITY="Developer ID Application"

          # Expand entitlement variables that Xcode normally resolves during signing
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Contents/Info.plist")
          sed -e "s/\$(PRODUCT_BUNDLE_IDENTIFIER)/$BUNDLE_ID/g" \
              -e "s/\$(AppIdentifierPrefix)/${APPLE_TEAM_ID}./g" \
              VoiceInk/VoiceInk.entitlements > $RUNNER_TEMP/entitlements.plist

          # Remove restricted entitlements that require a provisioning profile.
          # These are sandbox-only and unnecessary for non-sandboxed Developer ID apps.
          /usr/libexec/PlistBuddy -c "Delete :keychain-access-groups" $RUNNER_TEMP/entitlements.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :com.apple.security.temporary-exception.mach-lookup.global-name" $RUNNER_TEMP/entitlements.plist 2>/dev/null || true

          echo "=== Resolved entitlements ==="
          cat $RUNNER_TEMP/entitlements.plist

          # Sign all Mach-O binaries inside-out (frameworks, helpers, XPC services)
          find "$APP_PATH" -depth -type f | while read -r file; do
            if file "$file" | grep -q "Mach-O"; then
              codesign --force --options runtime --timestamp --sign "$IDENTITY" "$file" || true
            fi
          done

          # Sign nested bundles inside-out: .xpc, .app, .framework
          find "$APP_PATH" -depth \( -name "*.xpc" -o -name "*.app" -o -name "*.framework" \) -type d ! -path "$APP_PATH" | while read -r bundle; do
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$bundle"
          done

          # Sign main app bundle with resolved entitlements
          codesign --force --options runtime --timestamp \
            --entitlements $RUNNER_TEMP/entitlements.plist \
            --sign "$IDENTITY" "$APP_PATH"

          # Verify
          codesign --verify --deep --strict "$APP_PATH"
          echo "=== Embedded entitlements ==="
          codesign -d --entitlements - "$APP_PATH" 2>&1 | head -25
          echo "Code signing verified successfully"

      - name: Create DMG
        run: |
          APP_PATH="$RUNNER_TEMP/build/Build/Products/Release/Echo.app"
          DMG_PATH="$RUNNER_TEMP/Echo.dmg"

          DMG_DIR=$RUNNER_TEMP/dmg-contents
          mkdir -p "$DMG_DIR"
          cp -R "$APP_PATH" "$DMG_DIR/"
          ln -s /Applications "$DMG_DIR/Applications"

          hdiutil create -volname "Echo" \
            -srcfolder "$DMG_DIR" \
            -ov -format UDZO \
            "$DMG_PATH"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          RESULT=$(xcrun notarytool submit "$RUNNER_TEMP/Echo.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 600 2>&1) || true

          echo "$RESULT"

          # Extract submission ID and fetch log if failed
          SUB_ID=$(echo "$RESULT" | grep "id:" | head -1 | awk '{print $2}')
          if echo "$RESULT" | grep -q "status: Invalid"; then
            echo "--- Fetching notarization log ---"
            xcrun notarytool log "$SUB_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID"
            exit 1
          fi

          xcrun stapler staple "$RUNNER_TEMP/Echo.dmg"

      - name: Sign with Sparkle EdDSA key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SIGN_UPDATE=$(find $RUNNER_TEMP/spm -name "sign_update" -type f | head -1)

          if [ -z "$SIGN_UPDATE" ]; then
            echo "ERROR: Could not find Sparkle sign_update tool"
            exit 1
          fi
          chmod +x "$SIGN_UPDATE"

          SIGNATURE=$("$SIGN_UPDATE" "$RUNNER_TEMP/Echo.dmg" --ed-key-file <(echo "$SPARKLE_PRIVATE_KEY") 2>&1)
          echo "Sparkle signature output: $SIGNATURE"

          ED_SIGNATURE=$(echo "$SIGNATURE" | grep -o 'sparkle:edSignature="[^"]*"' | sed 's/sparkle:edSignature="//;s/"//')
          LENGTH=$(echo "$SIGNATURE" | grep -o 'length="[^"]*"' | sed 's/length="//;s/"//')

          echo "ED_SIGNATURE=$ED_SIGNATURE" >> $GITHUB_ENV
          echo "LENGTH=$LENGTH" >> $GITHUB_ENV

      - name: Update appcast.xml
        run: |
          PUB_DATE=$(date -u "+%a, %d %b %Y %H:%M:%S %z")
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}/Echo.dmg"

          # Convert markdown bullets to HTML list items for appcast
          RELEASE_NOTES_HTML=$(echo "${{ inputs.release_notes }}" | sed 's/^- \(.*\)/<li>\1<\/li>/g; s/^\* \(.*\)/<li>\1<\/li>/g')

          cat > website/public/appcast.xml << EOF
          <?xml version="1.0" standalone="yes"?>
          <rss xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" version="2.0">
              <channel>
                  <title>Echo Releases</title>
                  <item>
                      <title>${{ inputs.version }}</title>
                      <pubDate>${PUB_DATE}</pubDate>
                      <sparkle:version>${{ inputs.build_number }}</sparkle:version>
                      <sparkle:shortVersionString>${{ inputs.version }}</sparkle:shortVersionString>
                      <sparkle:minimumSystemVersion>15.0</sparkle:minimumSystemVersion>
                      <description><![CDATA[
                          <h3>What's New in Version ${{ inputs.version }}</h3>
                          <ul>
                              ${RELEASE_NOTES_HTML}
                          </ul>
                      ]]></description>
                      <enclosure url="${DOWNLOAD_URL}" length="${LENGTH}" type="application/octet-stream" sparkle:edSignature="${ED_SIGNATURE}"/>
                  </item>
              </channel>
          </rss>
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" \
            "$RUNNER_TEMP/Echo.dmg" \
            --title "Echo v${{ inputs.version }}" \
            --notes "## What's New in v${{ inputs.version }}

          ${{ inputs.release_notes }}"

      - name: Commit updated appcast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/public/appcast.xml
          git commit -m "Update appcast.xml for v${{ inputs.version }}"
          git checkout -- .
          git pull --rebase origin main
          git push

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $KEYCHAIN_PATH 2>/dev/null || true
